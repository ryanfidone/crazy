{% extends "catalog/base.html" %}
{% load crispy_forms_tags %}
{% block title %}Create an Account{% endblock %}
{% block content %}
<h1>Create an Account</h1>
<form method="post" class="form-group">{% csrf_token %}{{ form|crispy }}<button type="submit" class="btn btn-success">Register</button></form>
<p class="mt-3"><strong>Already have an account?</strong> <a href="{% url 'login' %}">Login Now</a></p>
{% endblock %}
