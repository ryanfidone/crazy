{% extends "catalog/base.html" %}
{% load crispy_forms_tags %}
{% block content %}
<h1>Login</h1>
<form method="post">{% csrf_token %}{{ form|crispy }}<input type="hidden" name="next" value="{{ next }}"><button class="btn btn-primary" type="submit">Login</button></form>
<p class="mt-3">Don't have an account? <a href="{% url 'register' %}">Sign Up Now</a></p>
<p><a href="{% url 'password_reset' %}">Forgot your password?</a></p>
{% endblock %}
